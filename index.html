<body>
  <main class="app">
    <header class="topbar">
      <div><div class="eyebrow">Combat Sandbox</div><h1>High Seas — Alignment & Firing Arcs</h1></div>
      <div class="help">Hover cannon / intent · Z enemy arcs · X friendly arcs · ←/→ move · E end turn · R reset turn · H exterior</div>
    </header>
    <section class="panel combat-panel">
      <div class="combat-stage" id="combatStage">
        <div class="corner-name enemy-corner">ENEMY</div>
        <div class="corner-name player-corner">YOUR SHIP</div>
        <div class="track-row" id="trackRow"></div>
        <div class="track-chevrons"><button id="moveAft" class="move-btn">◀</button><button id="moveFore" class="move-btn">▶</button></div>
        <div class="ship-block enemy-block" id="enemyBlock">
          <div class="mast-box enemy-mast" id="enemyMastBox"><div class="mast-title">MAIN MAST</div><div class="pips" id="enemyMastPips"></div></div>
          <div class="ship-grid enemy-grid" id="enemyGrid"></div>
        </div>
        <div class="ship-block player-block" id="playerBlock">
          <div class="mast-box player-mast" id="playerMastBox"><div class="mast-title">MAIN MAST</div><div class="pips" id="playerMastPips"></div></div>
          <div class="ship-grid player-grid" id="playerGrid"></div>
        </div>
        <svg class="arc-overlay" id="arcOverlay" aria-hidden="true"></svg>
      </div>
    </section>
    <section class="panel status-panel"><div><div class="eyebrow">Hovered / Selected</div><div id="weaponInfo" class="status-text">None</div></div><div><div class="eyebrow">Effect</div><div id="targetInfo" class="status-text">Hover an intent icon, or click a ready gun deck to plan a shot.</div></div></section>
  </main>
  <script src="combat-v11-data.js?v=20260909ab"></script>
  <script src="combat-v2-core.js?v=20260909ab"></script>
  <script src="combat-v2-ui.js?v=20260909ab"></script>
  <script src="combat-v2-controls.js?v=20260909ab"></script>
  <script>
    var enemyMastEl = enemyMastBox;
    function roomWidth(){ const el=enemyGrid.querySelector('.room'); return el ? el.getBoundingClientRect().width : ROOM_W(); }
  </script>
  <script src="combat-v11-turn.js?v=20260909ab"></script>

  <script src="combat-v14-polish.js?v=20260909ab"></script>
