<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>High Seas Combat Prototype</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">Combat Sandbox</div>
        <h1>High Seas — Alignment & Firing Arcs</h1>
      </div>
      <div class="help">Hover a cannon · Hold <strong>Z</strong> enemy arcs · Hold <strong>X</strong> friendly arcs · <strong>← →</strong> move · <strong>H</strong> exterior view</div>
    </header>

    <section class="panel combat-panel">
      <div class="combat-stage" id="combatStage">
        <div class="ship-block enemy-block" id="enemyBlock">
          <div class="ship-id enemy-id">
            <div class="ship-label">Enemy — Threat III</div>
            <div class="ship-name">THE IRON GULL</div>
          </div>
          <div class="ship-core enemy-core" id="enemyCore">
            <div class="ship-exterior" aria-hidden="true">
              <div class="hull-shell"></div>
              <div class="stern-shell"></div>
              <div class="bow-shell"></div>
              <div class="full-mast"><span class="yard yard-one"></span><span class="yard yard-two"></span></div>
            </div>
            <div class="mast-target" id="enemyMast" data-side="enemy" data-target-id="enemy-mast">
              <div class="mast-target-title">MAST</div>
              <div class="mast-target-pips">♥ ♥ ♥</div>
            </div>
            <div class="ship-grid enemy-grid" id="enemyGrid"></div>
          </div>
        </div>

        <div class="alignment-strip" aria-label="Relative ship position">
          <button id="moveAft" class="move-btn move-left" aria-label="Move left">◀</button>
          <div class="track-scale" id="trackScale"></div>
          <button id="moveFore" class="move-btn move-right" aria-label="Move right">▶</button>
        </div>

        <div class="ship-block player-block" id="playerBlock">
          <div class="ship-core player-core" id="playerCore">
            <div class="ship-exterior" aria-hidden="true">
              <div class="hull-shell"></div>
              <div class="stern-shell"></div>
              <div class="bow-shell"></div>
              <div class="full-mast"><span class="yard yard-one"></span><span class="yard yard-two"></span></div>
            </div>
            <div class="mast-target damaged" id="playerMast" data-side="player" data-target-id="player-mast">
              <div class="mast-target-title">MAST</div>
              <div class="mast-target-pips">♥ <span class="hit">✕</span> <span class="hit">✕</span></div>
            </div>
            <div class="ship-grid player-grid" id="playerGrid"></div>
          </div>
          <div class="ship-id player-id">
            <div class="ship-label">Your Ship</div>
            <div class="ship-name">THE WAYWARD</div>
          </div>
        </div>

        <svg class="arc-overlay" id="arcOverlay" aria-hidden="true"></svg>
      </div>
    </section>

    <section class="panel status-panel">
      <div>
        <div class="eyebrow">Inspection</div>
        <div id="weaponInfo" class="weapon-info">None</div>
      </div>
      <div>
        <div class="eyebrow">Combat Readout</div>
        <div id="targetInfo" class="target-info">Hover a cannon or threatened room.</div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
